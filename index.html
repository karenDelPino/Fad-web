<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Fad Grill - Menú</title>
    <link
      rel="icon"
      href="img/logo-hamburguesa.png"
      type="image/png"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img src="logo-fondo-Trasnparente.png" alt="Fad Grill" />
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar en el menú..."
          onkeyup="searchMenu()"
        />
      </div>
    </header>

    <section class="hero">
      <img
        src="logo-fondo-Trasnparente.png"
        alt="FAD Grill"
        class="hero-logo"
      />
      <h1 class="hero-title">
        ¡Tenemos delivery!
        <img
          src="img/delivery.png"
          alt="Delivery en moto"
          class="delivery-icon"
        />
      </h1>
      <p class="hero-subtitle">
        🔥 Tu hambre no espera... y nosotros tampoco
      </p>
    </section>

    <div class="categories">
      <button
        class="category-btn active"
        onclick="filterMenu('all')"
      >
        Todos
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('pizzas')"
      >
        Pizzas
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('hamburguesas')"
      >
        Hamburguesas
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('panchos')"
      >
        Panchos
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('lomos')"
      >
        Lomos
      </button>
       <button
        class="category-btn"
        onclick="filterMenu('vegetarianos')"
      >
        Vegetarianos
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('veganos')"
      >
        Veganos
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('empanadas')"
      >
        Empanadas
      </button>
      <button
        class="category-btn"
        onclick="filterMenu('bebidas')"
      >
        Bebidas
      </button>
     
    </div>

    <section class="menu" id="menu">
      <!-- Aquí se inyectarán las cards -->
    </section>

    <a
      href="https://wa.me/5492612189938?text=Hola%20quiero%20hacer%20un%20pedido"
      target="_blank"
      class="whatsapp-btn"
    >
      📲 Pedir por WhatsApp
    </a>
   

    <section class="ubicacion">
      <h2>📍 ¿Dónde estamos?</h2>
      <p>FAD Grill — Las Vasijas. Luján de Cuyo, Mendoza</p>
      <div class="mapa">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d836.2647029965309!2d-68.89368807147164!3d-33.02858099834056!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMzPCsDAxJzQyLjkiUyA2OMKwNTMnMzUuMCJX!5e0!3m2!1ses-419!2sus!4v1757434849308!5m2!1ses-419!2sus"
          width="100%"
          height="300"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </section>
    

    <footer class="footer">
      <p>Autoria propia ©2025</p>
    </footer>

    <script>
      // ----------------------------------------
      // 1. Variables de estado
      // ----------------------------------------
      let menuItems = [];
      let currentCategory = 'all';
      let currentSearch = '';

      // ----------------------------------------
      // 2. Cargo menu.json al iniciar la página
      // ----------------------------------------
      window.addEventListener('DOMContentLoaded', () => {
        fetch('menu.json')
          .then((res) => res.json())
          .then((data) => {
            Object.entries(data).forEach(([section, items]) => {
              items.forEach((item) => {
                // guardo la sección en minúsculas
                item._category = section.toLowerCase();
                menuItems.push(item);
              });
            });
            renderMenu();
          })
          .catch(console.error);
      });

      // ----------------------------------------
      // 3. Función para dibujar tarjetas
      // ----------------------------------------
      function renderMenu() {
        const container = document.getElementById('menu');
        container.innerHTML = '';

        menuItems
          .filter((item) => {
            // filtro por búsqueda
            const matchesSearch = item.name
              .toLowerCase()
              .includes(currentSearch);

            // filtro por categoría o subcategoría
            let matchesCategory;
            if (currentCategory === 'all') {
              matchesCategory = true;
            } else if (currentCategory === 'vegetarianos') {
              // cualquier sección que contenga "vegetari"
              matchesCategory = item._category.includes('vegetari');
            } else if (currentCategory === 'veganos') {
              // cualquier sección que contenga "vegana"
              matchesCategory = item._category.includes('vegana');
            } else {
              matchesCategory = item._category === currentCategory;
            }

            return matchesCategory && matchesSearch;
          })
          .forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.category = item._category;

            card.innerHTML = `
              <img src="${item.img}" alt="${item.name}" />
              <div class="card-content">
                <h3>${item.name}</h3>
                <p>${item.desc}</p>
                <span class="price">$${item.price ?? ''}</span>
              </div>
            `;
            container.appendChild(card);
          });
      }

      // ----------------------------------------
      // 4. Función para filtrar por categoría
      // ----------------------------------------
      function filterMenu(category) {
        currentCategory = category;
        document
          .querySelectorAll('.category-btn')
          .forEach((btn) => {
            btn.classList.toggle(
              'active',
              btn
                .getAttribute('onclick')
                .includes(`'${category}'`)
            );
          });
        renderMenu();
      }

      // ----------------------------------------
      // 5. Función para filtrar por búsqueda
      // ----------------------------------------
      function searchMenu() {
        currentSearch = document
          .getElementById('searchInput')
          .value.toLowerCase();
        renderMenu();
      }
    </script>
  </body>
</html>
